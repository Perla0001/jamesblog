{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto · James en Corea</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<nav class="navbar">
    <a href="/" class="nav-logo">James en Corea</a>
    <div class="nav-links">
        <a href="/skincare/" class="btn btn-secondary" style="padding:7px 18px">← Skincare</a>
    </div>
</nav>
<main class="main-content" style="max-width:680px">
    <div style="margin-bottom:1.5rem">
        <span class="badge-admin">Admin</span>
        <h1 style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;letter-spacing:-0.03em;margin-top:0.6rem">
            Nuevo producto
        </h1>
    </div>

    <form method="post" enctype="multipart/form-data"
          style="background:#fff;border:1px solid var(--crema-borde);border-radius:12px;padding:2rem;display:flex;flex-direction:column;gap:1.2rem">
        {% csrf_token %}

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group" style="margin:0">
                <label>Nombre del producto</label>
                <input type="text" name="nombre" placeholder="ej: Snail Mucin 96%" required autofocus>
            </div>
            <div class="form-group" style="margin:0">
                <label>Marca</label>
                <input type="text" name="marca" placeholder="ej: Cosrx" required>
            </div>
        </div>

        <div class="form-group">
            <label>Categoría</label>
            <select name="categoria" required>
                <option value="">— Selecciona —</option>
                {% for val, label in categorias %}
                <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Descripción y reseña</label>
            <textarea name="descripcion" rows="6" placeholder="Cuéntale a tu audiencia qué hace este producto, por qué lo recomiendas..."></textarea>
        </div>

        <div class="form-group">
            <label>Guía para Latinoamérica <span style="color:var(--texto-suave);font-weight:400">(opcional)</span></label>
            <textarea name="guia_latam" rows="4" placeholder="Cómo conseguirlo desde LATAM, dónde comprarlo, costos de envío..."></textarea>
        </div>

        <div class="form-group">
            <label>Guía para Europa <span style="color:var(--texto-suave);font-weight:400">(opcional)</span></label>
            <textarea name="guia_europa" rows="4" placeholder="Cómo conseguirlo desde Europa, recomendaciones..."></textarea>
        </div>

        <div class="form-group">
            <label>Imagen del producto <span style="color:var(--texto-suave);font-weight:400">(opcional)</span></label>
            <input type="file" name="imagen" accept="image/*">
        </div>

        <div style="display:flex;gap:0.8rem;padding-top:0.5rem">
            <button type="submit" class="btn btn-dark" style="padding:10px 28px">Publicar producto</button>
            <a href="/skincare/" class="btn btn-outline" style="padding:10px 20px">Cancelar</a>
        </div>
    </form>
</main>
<footer class="footer"><p>James en Corea del Sur — Seúl, 2026</p></footer>
</body>
</html>
